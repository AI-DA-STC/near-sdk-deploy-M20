ekf_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    # Frames
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # --- Source 0: rf2o scan-matching odometry (x, y only) ---
    odom0: /odom_rf2o
    odom0_config: [true,  true,  false,   # x, y, z
                    false, false, false,   # roll, pitch, yaw (IMU owns heading)
                    false, false, false,   # vx, vy, vz
                    false, false, false,   # roll_vel, pitch_vel, yaw_vel
                    false, false, false]   # ax, ay, az
    odom0_differential: true

    # --- Source 1: IMU (yaw angular velocity only) ---
    imu0: /M20/IMU
    imu0_config: [false, false, false,   # x, y, z
                   false, false, false,   # roll, pitch, yaw
                   false, false, false,   # vx, vy, vz
                   false, false, true,    # roll_vel, pitch_vel, yaw_vel
                   false, false, false]   # ax, ay, az
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
