route_server:
  ros__parameters:

    # ── Graph source ──────────────────────────────────────────────────────────
    # Absolute path to the SWAGGER GML waypoint graph.
    # Override at launch time via the 'graph_file' argument.
    graph_file: "/home/krishna/Workspace/near-sdk-deploy-M20/maps/graph.gml"

    # 2D occupancy grid YAML used to extract the map origin offset.
    # SWAGGER outputs node world-coords in the SLAM frame; AMCL reports poses
    # in the ROS map frame. These differ by the map origin (bottom-left corner
    # of the PGM in world coords). Providing this file corrects the alignment.
    map_yaml: "/home/krishna/Workspace/near-sdk-deploy-M20/maps/edifice_SLAM_v0_2d.yaml"

    # TF frame in which the output nav_msgs/Path is expressed.
    frame_id: "map"

    # Robot base frame — used to look up the robot's current pose from TF
    # when a /goal_pose message arrives from Rviz "2D Goal Pose" tool.
    base_frame: "base_link"

    # ── Path densification ────────────────────────────────────────────────────
    # Spacing between consecutive poses in the output Path [m].
    # 0.05 m = 5 cm resolution.
    interpolation_resolution: 0.05

    # ── Edge scoring weights ──────────────────────────────────────────────────
    # Composite edge cost:
    #
    #   cost = w_distance * (geometric_dist + type_penalty)
    #        + w_semantic * boundary_penalty
    #        + w_time     * (geometric_dist / robot_speed)
    #
    # type_penalty   : 0 for "skeleton" edges (medial-axis, obstacle-free)
    #                  1 for "delaunay" edges (triangulation, may cross obstacles)
    # boundary_penalty: 0.5 per endpoint labelled node_type="boundary"
    # time cost      : disabled when w_time = 0 (default)

    w_distance:  1.0   # weight on Euclidean distance + edge-type penalty
    w_semantic:  0.5   # weight on boundary / obstacle-proximity penalty
    w_time:      0.0   # weight on travel time (set > 0 to enable)
    robot_speed: 0.5   # nominal speed [m/s] used only when w_time > 0

    # ── Topology filter ───────────────────────────────────────────────────────
    # When true, only "skeleton" edges are traversed; Delaunay edges are ignored.
    # Skeleton edges follow the map's medial axis and are guaranteed obstacle-free.
    # Set false to allow Delaunay shortcuts penalised by delaunay_multiplier.
    skeleton_only: false

    # Cost multiplier applied to the distance of Delaunay edges.
    # Skeleton edge cost  = w_distance * geo_dist  (1x)
    # Delaunay edge cost  = w_distance * geo_dist * delaunay_multiplier
    # Higher values force the planner to prefer the skeleton (corridor) path.
    # Set to 1.0 to treat both edge types equally.
    delaunay_multiplier: 1.0
