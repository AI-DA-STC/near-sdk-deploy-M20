# ═══════════════════════════════════════════════════════════════════════════════
# LIFECYCLE MANAGER (single manager for all Nav2 lifecycle nodes)
# ═══════════════════════════════════════════════════════════════════════════════

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl
      - planner_server
      - smoother_server
      - controller_server
    bond_timeout: 0.0
